:root {

  --text: #2c3338;
  --text-light: #6b7480;
  --text-muted: #9ba3ad;
  --border: #e4e8e4;
  --accent: #e8b4a0;
  --warning: #e8a87c;
  --success: #4a9d7f;
  --danger: #d9717d;
  --blue: #5b8def;
  --purple: #9a6df2;
  --green: #4a9d7f;
  --teal: #38a3a5;
  --orange: #e8871e;
  --shadow: 0 2px 8px rgba(74,157,127,0.08);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {

}
header {
  position: sticky; top:0; z-index:50;
  background: linear-gradient(135deg, #f9d9e4, #f5c2d0);
  padding: 10px 12px 6px;
  box-shadow: 0 1px 6px rgba(201,122,142,0.25);
}
.hd-title { font-size:13px; font-weight:700; color:var(--primary-dark); letter-spacing:1px; }
.cd { display:flex; gap:6px; margin:7px 0; }
.cd div { flex:1; background:rgba(255,255,255,.65); border-radius:10px; padding:5px 2px; text-align:center; }
.cd b { font-size:16px; display:block; color:var(--primary-dark); font-weight:800; }
.cd span { font-size:10px; color:#a0707f; }
nav { display:flex; gap:4px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
nav::-webkit-scrollbar { display:none; }
nav button {
  flex:1; min-width:46px; border:0; background:rgba(255,255,255,.4); color:#96687a;
  font-size:13px; padding:6px 2px; border-radius:9px; font-weight:600; white-space:nowrap;
}
nav button.on { background:#fff; color:var(--primary-dark); box-shadow:0 1px 4px rgba(201,122,142,.3); }
main { padding:12px; max-width:560px; margin:0 auto; }
section { display:none; }
section.on { display:block; }
.card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:13px 14px; margin-bottom:12px; box-shadow:var(--shadow);
}
h2 { font-size:17px; margin-bottom:2px; }
h3 { font-size:14px; margin:12px 0 6px; }
h3:first-of-type { margin-top:8px; }
.sub { color:var(--text-light); font-size:12px; line-height:1.6; }
.lbl { font-size:11.5px; color:var(--text-muted); margin:9px 0 -4px; font-weight:600; }
.bar { height:8px; background:#f0e6ea; border-radius:99px; overflow:hidden; margin:7px 0 3px; }
.bar i { display:block; height:100%; background:var(--primary); border-radius:99px; transition:width .35s; }
.tag {
  display:inline-block; font-size:11px; padding:2px 9px; border-radius:99px;
  background:#fdeef3; color:var(--primary-dark); font-weight:700; margin:6px 0 8px;
}
.tag.red { background:#fdeaea; color:var(--danger); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip {
  border:1px solid var(--border); background:#fbfafa; border-radius:9px;
  padding:6px 9px; font-size:12.5px; line-height:1.4; cursor:pointer; user-select:none;
}
.chip.on { background:#eaf6f0; border-color:var(--success); color:var(--success); font-weight:600; }
.chip.cur { border-style:dashed; border-color:var(--blue); color:var(--blue); font-weight:600; }
.row {
  display:flex; align-items:flex-start; gap:9px; padding:10px 11px;
  border:1px solid var(--border); border-radius:11px; margin-bottom:7px;
  cursor:pointer; user-select:none; background:#fbfafa;
}
.row .dot { width:18px; height:18px; border-radius:50%; border:2px solid #d5c9ce; flex:none; margin-top:3px; }
.row .t { font-size:13.5px; }
.row .s { font-size:11px; color:var(--text-muted); margin-top:1px; }
.row.on { background:#eaf6f0; border-color:var(--success); }
.row.on .dot { background:var(--success); border-color:var(--success); }
.row.on .t { color:#3d7d63; }
.tip {
  background:#fff8e9; border:1px solid #f2e0b8; border-radius:10px;
  padding:9px 11px; font-size:12.5px; color:#8a6d2f; margin-top:10px; line-height:1.65;
}
.tip.green { background:#eef8f2; border-color:#c8e8d6; color:#3d7d63; }
.tip.red { background:#fdefef; border-color:#f2caca; color:#b0525e; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
td { padding:5px 2px; border-bottom:1px dashed var(--border); }
td b { color:var(--primary-dark); }
.mut { color:var(--text-muted); }
textarea#io {
  width:100%; height:70px; border:1px solid var(--border); border-radius:10px;
  padding:8px; font-size:11px; color:var(--text-light); resize:none; background:#fbfafa;
}
.btn {
  display:inline-block; border:0; border-radius:10px; padding:9px 16px;
  font-size:13px; font-weight:600; margin:6px 6px 0 0; cursor:pointer;
  background:var(--primary); color:#fff;
}
.btn.ghost { background:#fff; color:var(--primary-dark); border:1px solid var(--primary-light); }
input#wt {
  border:1px solid var(--border); border-radius:9px; padding:7px 9px;
  font-size:14px; width:100px; background:#fff;
}
.sleeprow { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
.sdot { font-size:11px; color:var(--text-muted); }
.prow { display:flex; align-items:center; gap:7px; padding:6px 2px; border-bottom:1px dashed var(--border); font-size:12.5px; }
.prow:last-child { border-bottom:0; }
.prow .pn { font-weight:600; flex:none; }
.prow .pv { color:var(--text-muted); font-size:11px; flex:1; text-align:right; }
/* 侧栏导航：宽屏常开，窄屏为滑出抽屉 */
.hd-top { display:flex; align-items:center; gap:9px; }
.burger {
  width:34px; height:34px; flex:none; border:0; border-radius:10px;
  background:rgba(255,255,255,.7); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3.5px; cursor:pointer;
}
.burger i { display:block; width:16px; height:2px; border-radius:2px; background:var(--primary-dark); }
.drawer-mask {
  position:fixed; inset:0; background:rgba(44,51,56,.4); z-index:200;
  opacity:0; visibility:hidden; transition:opacity .22s, visibility .22s;
}
.drawer-mask.on { opacity:1; visibility:visible; }
.drawer {
  position:fixed; top:0; left:0; bottom:0; width:250px; max-width:78vw; z-index:201;
  background:#fff; box-shadow:3px 0 16px rgba(74,157,127,.16);
  transform:translateX(-102%); transition:transform .25s ease;
  display:flex; flex-direction:column; padding:0 0 16px;
}
.drawer.on { transform:translateX(0); }
.drawer .dh {
  background:linear-gradient(135deg,#f9d9e4,#f5c2d0); padding:16px 16px 13px;
  font-size:15px; font-weight:800; color:var(--primary-dark); letter-spacing:.5px;
}
.drawer .dh span { display:block; font-size:11px; font-weight:600; color:#a0707f; margin-top:3px; letter-spacing:0; }
.drawer .dbody { overflow-y:auto; padding:8px 10px 0; }
.drawer .dgroup { font-size:10.5px; color:var(--text-muted); font-weight:700; letter-spacing:1px; padding:12px 8px 5px; }
.drawer .ditem {
  display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:11px;
  font-size:14px; font-weight:600; color:var(--text); cursor:pointer; margin-bottom:2px;
}
.drawer .ditem .di { width:20px; text-align:center; font-size:15px; }
.drawer .ditem.on { background:#fdeef3; color:var(--primary-dark); }
.drawer .ditem:active { background:#faf3f5; }
h2 .hd-note { font-size:11px; color:var(--text-muted); font-weight:500; margin-left:6px; }
/* 常开侧栏：>=900px 时抽屉固定展开，主内容左移 */
@media (min-width:900px){
  .burger { display:none; }
  .drawer { transform:none; box-shadow:1px 0 0 var(--border); }
  .drawer-mask { display:none; }
  body { padding-left:250px; }
  header { left:250px; }
  header { position:sticky; }
  main { max-width:640px; }
}
@media (max-width:899px){
  header { position:sticky; }
}
/* 复盘页小卡 */
.rgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-top:6px; }
.ropt {
  border:1px solid var(--border); background:#fbfafa; border-radius:10px;
  padding:9px 8px; font-size:12.5px; text-align:center; cursor:pointer; user-select:none; font-weight:600;

.ropt.on { background:#eaf6f0; border-color:var(--success); color:var(--success); }
.ropt.mood.on { background:#fdeef3; border-color:var(--primary); color:var(--primary-dark); }
.rmark { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.rmark .ropt { padding:6px 10px; font-size:12px; }
.rep-item { border-bottom:1px dashed var(--border); padding:8px 2px; font-size:12.5px; }
.rep-item:last-child { border-bottom:0; }
.rep-item b { color:var(--primary-dark); }
.rep-item .rt { font-size:11px; color:var(--text-muted); }
</style>

function trackStat(k){
  const tr=TRACKS[k],arr=data[tr.key],a=tr.from||0,b=tr.to||arr.length;
  let d=0; for(let i=a;i<b;i++) if(arr[i]) d++;

}
function unitName(k,i){
  if(k==='m1') return i<38?String(i+1).padStart(2,'0')+' '+M1_LABELS[i]:String(i+1).padStart(2,'0');

}
const nextIdx=k=>{
  const tr=TRACKS[k],arr=data[tr.key],a=tr.from||0,b=tr.to||arr.length;

};
const mondayStr=()=>{ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return fmt(d); };
function snapVal(wk,k){ return (data.snap[wk]&&data.snap[wk][k]!=null)?data.snap[wk][k]:null; }
function ensureSnap(){
  const wk=mondayStr();
  if(!data.snap[wk]){
    const s={};
    for(const k in TRACKS) s[k]=trackStat(k).done;
    data.snap[wk]=s; save();
  }
}
function depOK(k){
  const d=TRACKS[k].dep;
  if(!d) return true;
  const st=trackStat(d);
  return st.done>=st.total;
}
function physPhase(){
  for(const k of ['pz1','pms','pz2','pma']) if(nextIdx(k)>=0) return k;
  return null;
}
function pace(k){
  const tr=TRACKS[k], st=trackStat(k);
  const total=st.total, done=st.done, remain=total-done;
  const dl=daysTo(tr.dl), days=Math.max(1,dl+1), weeks=Math.max(1,Math.ceil(days/7));
  const perWeek=Math.ceil(remain/weeks), perDay=remain/days;
  const elapsed=Math.max(1,Math.round((new Date(new Date().toDateString())-new Date(mondayStr()+'T00:00:00'))/86400000)+1);
  const base=snapVal(mondayStr(),k);
  const done7=base==null?0:Math.max(0,done-base);
  const behind=+(perDay*elapsed-done7).toFixed(1);
  const run=(!tr.go||DSTR()>=tr.go)&&depOK(k);
  const expired=dl<0&&remain>0;
  return {tr:tr,total:total,done:done,remain:remain,dl:dl,days:days,perWeek:perWeek,done7:done7,behind:behind,run:run,expired:expired};
}
function paceLine(k){
  const p=pace(k), tr=p.tr;
  if(!p.run){
    if(tr.dep){ const ds=trackStat(tr.dep); return '未解锁：先清完「'+TRACKS[tr.dep].name+'」（'+ds.done+'/'+ds.total+'）——严格串行不双线'; }
    return '待开跑（'+tr.go.replace(/-/g,'/')+' 起），开跑后按截止日自动配速';
  }
  if(p.remain<=0) return '已全部清完';
  if(p.expired) return '已过截止日，剩 '+p.remain+' '+tr.u+'——需要重排截止日';
  let s='当前：'+unitName(k,nextIdx(k))+' · 剩 '+p.remain+' '+tr.u+' · 距截止 '+p.dl+' 天 → 每周清 '+p.perWeek+' '+tr.u;
  if(p.done7>0) s+='（本周已清 '+p.done7+'）';
  if(p.behind>=0.5) s+=' · 落后约'+Math.ceil(p.behind)+tr.u+'，本周内补上';
  else if(p.behind<=-0.5) s+=' · 超前，配速自动放松';
  return s;
}
function paceRows(){
  let h='';
  for(const k in TRACKS){
    const p=pace(k);
    if(p.remain<=0) continue;
    let st;
    if(!p.run) st='<span class="mut">'+(p.tr.dep?'待解锁':'待开跑')+'</span>';
    else if(p.expired) st='<span class="mut">需重排</span>';
    else if(p.behind>=0.5) st='<b style="color:var(--danger)">落后'+Math.ceil(p.behind)+p.tr.u+'</b>';
    else if(p.behind<=-0.5) st='<b style="color:var(--success)">超前</b>';
    else st='<span class="mut">正常</span>';

  }
  return h||'<div class="sub">所有轨道清完！</div>';
}
function paceBanner(){
  const warns=[];
  for(const k in TRACKS){ const p=pace(k); if(p.run&&!p.expired&&p.remain>0&&p.behind>=0.5) warns.push(k); }
  if(!warns.length) return '<div class="tip green" style="margin-top:0"><b>配速正常。</b>把「本周硬任务」清完就稳了，继续保持。</div>';
  const names=warns.map(k=>TRACKS[k].name+' 落后约'+Math.ceil(pace(k).behind)+TRACKS[k].u).join(' · ');
  return '<div class="tip red" style="margin-top:0"><b>落后警示：</b>'+names+'。没完成的不跳过——今天欠的明天接着算，本周内补上就回到正轨。</div>';
}
function weekBoard(){
  let h='', any=false;
  for(const k in TRACKS){
    const p=pace(k);
    if(!p.run||p.remain<=0) continue;
    const start=nextIdx(k);
    const need=Math.max(0,p.perWeek-Math.max(0,p.done7));
    if(need<=0||start<0) continue;
    any=true;
    const hi=p.tr.to||data[p.tr.key].length;
    h+='<div class="lbl">'+p.tr.name+' · 本周待清 '+need+' '+p.tr.u+'</div><div class="chips" style="margin:5px 0 4px">';
    for(let j=0;j<need&&start+j<hi;j++) h+=chip(p.tr.key,start+j,unitName(k,start+j)).replace('data-act="chip"','data-act="chip" data-w="1"');
    h+='</div>';
  }
  return any?h:'<div class="sub">本周配速内任务已清完，超前部分都是赚的。想加量就去科目页往前追。</div>';
}

        const pool=id[0]==='s'?SPRINT[ds]:THEME[dd.getDay()];
        if(pool&&pool.items){ const it=pool.items[+base.slice(1)]; if(it&&it.s) s=it.s; }
      }

    });
  }
  return {rows:rows,subs:subs};
}

function weekAdvice(ws,subs){

      b.done.push(c.dataset.id);
      if(tidx>=0) data[trk][tidx]=true;
      c.classList.add('on');
    }
    save(); bars(); updatePace(); renderEnglish();
  }
  else if(a==='sleep'){
    data.sleep[DSTR()]=+c.dataset.i; save(); renderReview();
  }
  else if(a==='wt'){
    const v=parseFloat($('wt').value);
    if(v>20&&v<200){ data.weight[DSTR()]=v; save(); renderWt(); $('wt').value=''; }
    else alert('请输入合理的体重');
  }
  else if(a==='exp'){ $('io').value=JSON.stringify(data); $('io').select(); }
  else if(a==='imp'){
    try{ const d=JSON.parse($('io').value); if(!d.version) throw 0; data=d; save(); location.reload(); }
    catch(err){ alert('导入失败：请粘贴完整的备份文本'); }
  }
});
function bars(){
  bar('b_m1',data.m1); bar('b_m2',data.m2); bar('b_m3',data.m3); bar('b_sp',data.sp); bar('b_hv',data.hv); bar('b_wd',data.wd);
  bar('b_pz1',data.pz.slice(0,5)); bar('b_pms',data.pm.slice(0,23)); bar('b_pz2',data.pz.slice(5,10)); bar('b_pma',data.pm.slice(23,49));
  bar('b_cz',data.cz); bar('b_cm1',data.cm.slice(0,37)); bar('b_cm2',data.cm.slice(37,86));
  bar('b_bio',data.bio); bar('b_gr',data.gr);
  if($('t_m')){ bar('t_m',data.m1); bar('t_p',data.pz.concat(data.pm)); bar('t_c',data.cz.concat(data.cm)); bar('t_b',data.bio); }
}

/* ================= 启动 ================= */
(function init(){
  ensureSnap();
  const n1=daysTo('2026-10-23'), n2=daysTo('2027-01-31'), n3=daysTo('2027-06-07');
  $('cd1').textContent=n1>0?n1+'天':(n1===0?'今天':'已考');
  $('cd2').textContent=n2>0?n2+'天':'到啦';
  $('cd3').textContent=n3>0?n3+'天':'加油';
  const d=new Date();
  $('dateline').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WD[d.getDay()]+(SPRINT[DSTR()]?' · 冲刺期':'');
  renderMath(); renderPhysics(); renderChem(); renderBio(); renderEnglish(); renderToday(); renderWeek();
  renderDailyRep(); renderWeekRep(); renderMonthRep(); renderReview();
  bars();
  updatePace();
})();
</script>
