.row.on { background:#eaf6f0; border-color:var(--success); }
.row.on .dot { background:var(--success); border-color:var(--success); }
.row.on .t { color:#3d7d63; }

td { padding:5px 2px; border-bottom:1px dashed var(--border); }

.mut { color:var(--text-muted); }

    const m1=Array(72).fill(false); m1[0]=m1[1]=m1[2]=m1[3]=m1[4]=true;

/* ================= 复盘页 ================= */
function weekSum(){
  const rows=[]; const subs={math:0,physics:0,chem:0,bio:0,english:0,review:0};
  for(let k=6;k>=0;k--){
    const dd=new Date(); dd.setDate(dd.getDate()-k);
    const ds=fmt(dd), b=(data.blocks[ds]&&data.blocks[ds].done)||[];
    rows.push({ds:ds,n:b.length,tag:SPRINT[ds]?SPRINT[ds].tag:(THEME[dd.getDay()]?THEME[dd.getDay()].tag:'')});
    b.forEach(id=>{
      let s=null;
      if(id==='w') s='english';
      else if(id[0]==='s'&&SPRINT[ds]){ const it=SPRINT[ds].items[+id.slice(1)]; if(it) s=it.s; }
      else if(id[0]==='t'&&THEME[dd.getDay()]){ const it=THEME[dd.getDay()].items[+id.slice(1)]; if(it) s=it.s; }
      if(s&&subs[s]!=null) subs[s]++;
    });
  }
  return {rows:rows,subs:subs};
}
const SLEEP_LB=['≤5.5h','6h','6.5h','7h','≥7.5h'];
function renderReview(){
  const t=DSTR(), ws=weekSum();
  let h='<div class="card"><h2>最近 7 天</h2><table>';
  ws.rows.forEach(r=>{ h+='<tr><td>'+r.ds.slice(5)+'</td><td class="mut">'+r.tag+'</td><td style="text-align:right"><b>'+r.n+'</b> 项</td></tr>'; });
  h+='</table><div class="sub" style="margin-top:8px">本周各科完成：数学 <b>'+ws.subs.math+'</b> · 物理 <b>'+ws.subs.physics+'</b> · 化学 <b>'+ws.subs.chem+'</b> · 生物 <b>'+ws.subs.bio+'</b> · 英语 <b>'+ws.subs.english+'</b> 项</div>'
    +'<div class="sub">数量 ≠ 小时数，但足够看出今天有没有偷懒。</div></div>';
  h+='<div class="card"><h3>睡眠 · 体重</h3>'
    +'<div class="lbl">昨晚睡眠</div><div class="sleeprow">';
  const sv=data.sleep[t];
  SLEEP_LB.forEach((lb,i)=>{ h+='<div class="chip'+(sv===i?' on':'')+'" data-act="sleep" data-i="'+i+'">'+lb+'</div>'; });
  h+='</div><div class="lbl">最近体重</div><div class="sub" id="wtinfo"></div>'
    +'<div style="margin-top:8px"><input id="wt" type="number" step="0.1" inputmode="decimal" placeholder="今天 kg"> <button class="btn ghost" data-act="wt">记录</button></div>'
    +'<div class="tip green" style="margin-top:10px"><b>增重提醒：</b>目标区间 45~50kg。每天三顿正餐 + 上下午加餐（奶/蛋/面包），把「吃」当任务完成，体重一周涨 0.25kg 就是胜利。</div></div>';
  h+='<div class="card"><h3>备份 · 安装</h3>'
    +'<button class="btn" data-act="exp">导出备份</button><button class="btn ghost" data-act="imp">导入备份</button>'
    +'<textarea id="io" placeholder="点「导出备份」复制这里全部文字保存到备忘录；换手机时粘贴回来点「导入备份」"></textarea>'
    +'<div class="sub" style="margin-top:8px">iPhone：Safari 打开 → 分享 → 添加到主屏幕。若显示旧版：链接后加 <b>?v=4</b> 或删除旧图标重新添加。</div>'
    +'<div class="sub">v4 · 2026-09-25 · 课程系统版</div></div>';
  $('p_review').innerHTML=h;
  renderWt();
}
function renderWt(){
  const el=$('wtinfo'); if(!el) return;
  const ks=Object.keys(data.weight).sort();
  if(!ks.length){ el.textContent='还没记录过'; return; }
  const lk=ks[ks.length-1], lw=data.weight[lk];
  const bmi=(lw/(1.63*1.63)).toFixed(1);
  el.innerHTML='最新 <b>'+lw+'kg</b>（'+lk.slice(5)+'） · BMI <b>'+bmi+'</b>'+(lw<45?' · 还在目标区间（45~50kg）之下，慢慢补，别急':' · 继续保持');
}

/* ================= 事件 ================= */
function show(p){
  ['today','math','physics','chem','bio','english','review'].forEach(x=>{
    $('p_'+x).classList.toggle('on',x===p);
  });
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  const c=e.target.closest('[data-act]'); if(!c) return;
  const a=c.dataset.act;
  if(a==='nav'){ show(c.dataset.p); }
  else if(a==='chip'){
    const k=c.dataset.k, i=+c.dataset.i;
    data[k][i]=!data[k][i]; c.classList.toggle('on',data[k][i]); save(); bars();
  }
  else if(a==='row'){
    const id=c.dataset.id, b=blk(), p=b.done.indexOf(id);
    if(p>=0){ b.done.splice(p,1); c.classList.remove('on'); }
    else { b.done.push(id); c.classList.add('on'); }
    save(); renderEnglish();
  }
  else if(a==='sleep'){
    data.sleep[DSTR()]=+c.dataset.i; save(); renderReview();
  }
  else if(a==='wt'){
    const v=parseFloat($('wt').value);
    if(v>20&&v<200){ data.weight[DSTR()]=v; save(); renderWt(); $('wt').value=''; }
    else alert('请输入合理的体重');
  }
  else if(a==='exp'){ $('io').value=JSON.stringify(data); $('io').select(); }
  else if(a==='imp'){
    try{ const d=JSON.parse($('io').value); if(!d.version) throw 0; data=d; save(); location.reload(); }
    catch(err){ alert('导入失败：请粘贴完整的备份文本'); }
  }
});
function bars(){
  bar('b_m1',data.m1); bar('b_m2',data.m2); bar('b_m3',data.m3); bar('b_sp',data.sp); bar('b_hv',data.hv);
  bar('b_pz',data.pz); bar('b_pm',data.pm);
  bar('b_cz',data.cz); bar('b_cm',data.cm);
  bar('b_bio',data.bio); bar('b_gr',data.gr);
  if($('t_m')){ bar('t_m',data.m1); bar('t_p',data.pz.concat(data.pm)); bar('t_c',data.cz.concat(data.cm)); bar('t_b',data.bio); }
}

  renderMath(); renderPhysics(); renderChem(); renderBio(); renderEnglish(); renderToday(); renderReview();
  bars();
})();
